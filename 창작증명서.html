<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>창작 증명서</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f8f9fa;color:#1a1a2e;padding:32px 16px}
.wrap{max-width:860px;margin:0 auto}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;padding:32px 36px;border-radius:16px 16px 0 0}
.header h1{font-size:24px;font-weight:700;letter-spacing:-.5px}
.header .subtitle{font-size:13px;opacity:.7;margin-top:4px}
.stats{margin-top:16px;display:flex;gap:20px;flex-wrap:wrap;font-size:13px}
.stats b{font-size:20px;font-weight:700;display:block;line-height:1.1}
.stats .lbl{opacity:.65;font-size:11px;letter-spacing:.5px}
.toolbar{background:#fff;padding:16px 36px;border-bottom:1px solid #e9ecef;position:sticky;top:0;z-index:5}
#search{width:100%;padding:12px 16px;border:1px solid #dde1e6;border-radius:10px;font-size:14px;outline:none}
#search:focus{border-color:#0f3460;box-shadow:0 0 0 3px rgba(15,52,96,.1)}
.list{background:#fff;border-radius:0 0 16px 16px;box-shadow:0 4px 24px rgba(0,0,0,.06);padding:12px 20px 28px;min-height:120px}
.work{border:1px solid #eceef1;border-radius:12px;margin:12px 0;overflow:hidden}
.work-head{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;user-select:none}
.work-head:hover{background:#fafbfc}
.work-name{font-size:16px;font-weight:600;flex:1;word-break:break-all}
.chev{transition:transform .2s;color:#aab;font-size:13px}
.work.open .chev{transform:rotate(90deg)}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;background:#eef1f4;color:#456;white-space:nowrap}
.pill.btc{background:#fff4e0;color:#a8741a}
.pill.ok{background:#e8f5e9;color:#2e7d32}
.meta-line{font-size:12px;color:#888;margin-top:3px}
.detail{display:none;padding:4px 20px 20px;border-top:1px solid #f1f3f5}
.work.open .detail{display:block}
.field{margin:14px 0}
.field-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#999;margin-bottom:4px}
.hash{font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:11.5px;background:#f1f3f5;padding:10px 14px;border-radius:8px;border:1px solid #e9ecef;line-height:1.7;word-break:break-all}
.growth{margin-top:18px}
.growth h4{font-size:12px;font-weight:600;margin-bottom:8px;color:#444}
.bar-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar-row .v{width:30px;font-size:11px;color:#666;text-align:right}
.bar-track{flex:1;background:#f1f3f5;border-radius:4px;height:20px}
.bar-fill{background:linear-gradient(90deg,#1a1a2e,#0f3460);border-radius:4px;height:100%;min-width:2px}
.bar-row .c{width:64px;font-size:11px;color:#333;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}
th{text-align:left;padding:7px 10px;background:#f8f9fa;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#666;border-bottom:2px solid #e9ecef}
td{padding:7px 10px;border-bottom:1px solid #f1f3f5;vertical-align:top}
code{font-family:'SF Mono','Fira Code',monospace;font-size:11px}
.empty{text-align:center;color:#aab;padding:48px 0;font-size:14px}
.footer{text-align:center;font-size:11px;color:#aab;margin-top:20px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>창작 증명서</h1>
    <div class="subtitle">Proof of Authorship — 해시 체인 · 타임스탬프 · 블록체인 앵커</div>
    <div class="stats">
      <div><b id="st-files">0</b><span class="lbl">작품</span></div>
      <div><b id="st-records">0</b><span class="lbl">총 기록</span></div>
      <div><b id="st-btc">0</b><span class="lbl">BTC 앵커</span></div>
    </div>
  </div>
  <div class="toolbar">
    <input id="search" type="text" placeholder="🔍 파일명으로 검색…" autocomplete="off">
  </div>
  <div class="list" id="list"></div>
  <div class="footer">
    이 증명서는 각 파일의 SHA-256 해시·기록 시각·해시 체인 무결성을 증명합니다.<br>
    Generated by Authorship Proof Stamp v3.1 · 서버 없이 브라우저에서 동작
  </div>
</div>

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function num(n){return Number(n).toLocaleString();}

// 파일명별 그룹
const groups = {};
for(const r of RECORDS){ const k=(r['파일명']||'').normalize('NFC'); (groups[k] ||= []).push(r); }
for(const k in groups){ groups[k].sort((a,b)=>a['버전']-b['버전']); }
const works = Object.keys(groups).map(name=>{
  const hist = groups[name];
  const latest = hist[hist.length-1];
  return {name, hist, latest};
}).sort((a,b)=> (b.latest['타임스탬프']||'').localeCompare(a.latest['타임스탬프']||''));

document.getElementById('st-files').textContent = works.length;
document.getElementById('st-records').textContent = RECORDS.length;
document.getElementById('st-btc').textContent = RECORDS.filter(r=>r['블록체인_앵커']).length;

function growthHtml(hist){
  const data = hist.filter(h=>h['글자수']!=null).map(h=>({v:h['버전'],c:h['글자수']}));
  if(!data.length) return '';
  const max = Math.max(...data.map(d=>d.c))||1;
  let bars='';
  for(const d of data){
    const pct=(d.c/max)*100;
    bars+=`<div class="bar-row"><span class="v">v${d.v}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="c">${num(d.c)}자</span></div>`;
  }
  return `<div class="growth"><h4>글자 수 성장 곡선 — 사람의 글은 점진적으로 자랍니다</h4>${bars}</div>`;
}

function detailHtml(w){
  const L=w.latest;
  let anchor='';
  if(L['블록체인_앵커']){
    const a=L['블록체인_앵커'];
    anchor=`<div class="field"><div class="field-label">블록체인 앵커 (Bitcoin)</div><div class="hash">블록 #${num(a.block_height)}<br>${esc(a.block_hash)}</div></div>`;
  }
  let otsField='';
  if(L['OTS상태']){
    const blk=L['OTS블록']?` · 비트코인 블록 #${num(L['OTS블록'])}`:'';
    const note = L['OTS상태']==='확정'
      ? '✅ 이 파일이 위 블록 시점 이전에 존재했음이 비트코인에 영구 기록되었습니다. 제출 패키지의 .ots 파일로 누구나 검증할 수 있습니다.'
      : '⏳ 캘린더 서버에 제출 완료. 비트코인 확정(보통 수 시간) 후 OTS검증으로 갱신됩니다.';
    otsField=`<div class="field"><div class="field-label">OpenTimestamps — 비트코인 제3자 공증</div><div class="hash">상태: ${esc(L['OTS상태'])}${blk}<br>${note}</div></div>`;
  }
  let rows='';
  for(const h of [...w.hist].reverse()){
    const cc=h['글자수']!=null?num(h['글자수'])+'자':'-';
    rows+=`<tr><td>v${h['버전']}</td><td>${esc((h['타임스탬프']||'').slice(0,19))}</td><td><code>${esc(h['SHA256'].slice(0,20))}…</code></td><td>${esc(h['유형'])}</td><td>${esc(h['파일크기_표시'])}</td><td>${cc}</td></tr>`;
  }
  return `
    <div class="field"><div class="field-label">최신 SHA-256 해시</div><div class="hash">${esc(L['SHA256'])}</div></div>
    <div class="field"><div class="field-label">해시 체인</div><div class="hash">현재: ${esc(L['체인해시']||'N/A')}<br>이전: ${esc(L['이전체인']||'N/A')}</div></div>
    ${anchor}
    ${otsField}
    ${growthHtml(w.hist)}
    <table><thead><tr><th>버전</th><th>시각</th><th>해시</th><th>유형</th><th>크기</th><th>글자수</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function render(filter){
  const list=document.getElementById('list');
  const f=(filter||'').trim().toLowerCase();
  const shown=works.filter(w=>!f||w.name.toLowerCase().includes(f));
  if(!shown.length){ list.innerHTML=`<div class="empty">${RECORDS.length? '검색 결과가 없습니다.' : '아직 기록된 작품이 없습니다.'}</div>`; return; }
  list.innerHTML=shown.map((w,i)=>{
    const L=w.latest;
    const cc=L['글자수']!=null?` · ${num(L['글자수'])}자`:'';
    const btc=L['블록체인_앵커']?'<span class="pill btc">BTC 앵커</span>':'';
    let ots='';
    if(L['OTS상태']==='확정') ots=`<span class="pill ok">⛓ 공증확정${L['OTS블록']?' #'+num(L['OTS블록']):''}</span>`;
    else if(L['OTS상태']) ots=`<span class="pill">⛓ 공증 ${esc(L['OTS상태'])}</span>`;
    return `<div class="work" data-i="${i}">
      <div class="work-head">
        <span class="chev">▶</span>
        <div style="flex:1">
          <div class="work-name">${esc(w.name)}</div>
          <div class="meta-line">v${L['버전']} · ${esc((L['타임스탬프']||'').slice(0,16))}${cc} · 수정 ${w.hist.length-1}회</div>
        </div>
        <span class="pill">v${L['버전']}</span>${btc}${ots}
      </div>
      <div class="detail">${detailHtml(w)}</div>
    </div>`;
  }).join('');
  // 펼치기 토글
  list.querySelectorAll('.work-head').forEach(h=>{
    h.addEventListener('click',()=>h.parentElement.classList.toggle('open'));
  });
}

document.getElementById('search').addEventListener('input',e=>render(e.target.value));
render('');
</script>
</body>
</html>
